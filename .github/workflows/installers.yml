name: Build desktop installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - name: Install pinned dependencies
        run: python -m pip install -r installer/requirements-lock.txt
      - name: Build and verify native app and DMG
        run: python installer/build_macos.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DoceInk-macOS-${{ matrix.arch }}
          path: |
            installer/dist/*.dmg
            installer/dist/SHA256SUMS-*.txt
            installer/build/*test*.json
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1
      - name: Verify packaged installer without USB access
        shell: pwsh
        run: |
          $app = Resolve-Path 'installer/dist/DoceInk-Setup-0.75.149.1.exe'
          foreach ($mode in @('self-test', 'smoke-test', 'download-test')) {
            $result = Join-Path $PWD "installer/dist/$mode.json"
            $process = Start-Process -FilePath $app -ArgumentList "--$mode", $result -PassThru -Wait -WindowStyle Hidden
            if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw "$mode failed" }
            Get-Content $result
          }
          $hash = (Get-FileHash $app -Algorithm SHA256).Hash.ToLower()
          "$hash  $([IO.Path]::GetFileName($app))" | Set-Content 'installer/dist/SHA256SUMS-Windows.txt'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DoceInk-Windows
          path: |
            installer/dist/*.exe
            installer/dist/*.txt
            installer/dist/*.json
          if-no-files-found: error
